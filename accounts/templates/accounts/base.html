<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DonationMatch{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #333333;
            min-height: 100vh;
        }

        header {
            background-color: #8D343C;
            padding: 18px 8%;
            color: white;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #FFC900;
        }

        main {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .messages {
            margin-bottom: 20px;
        }

        .message {
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            background-color: #fff3cd;
            color: #664d03;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #777777;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">
            Donation<span>Match</span>
        </div>
    </header>
    <main>
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="message">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}
        {% block content %}
        {% endblock %}
    </main>
    <footer>
        &copy; 2026 DonationMatch. Give What You Have. Match What They Need.
    </footer>
</body>

</html>
